name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - run: corepack enable && corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: validate snapshot
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        if ! git diff --quiet --exit-code -- calcit.cirru; then
          echo '::error::calcit.cirru is not canonical; run the pinned Calcit edit format and commit its reviewed result.'
          exit 1
        fi
        strict_exit=0
        strict_report="$(calcit fix --workflow strict --verify --format json)" || strict_exit=$?
        printf '%s\n' "$strict_report"
        test "$strict_exit" -eq 0
        jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$strict_report"
        calcit calcit.cirru --check-only --all-defs
        calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Select frontend CDN path
      id: assets
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_OUTPUT"

    - name: Build frontend
      env:
        CDN_BASE: ${{ steps.assets.outputs.base-url }}
      run: |
        calcit calcit.cirru js
        yarn vite build --base="$CDN_BASE"

    - name: Check current production revision
      id: production
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Retain tested PR build
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pointed-prompt-preview
        path: dist
        if-no-files-found: error
        retention-days: 7

    - name: Upload and verify frontend assets
      if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist/assets
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.assets.outputs.prefix }}assets/
        public-base-url: ${{ steps.assets.outputs.base-url }}assets/
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      id: deploy
      if: steps.production.outputs.current == 'true'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
